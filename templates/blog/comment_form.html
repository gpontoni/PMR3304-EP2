{% extends 'base.html' %}

{% block title %}Comentar | {{ post.title }}{% endblock %}

{% block content %}
<h2>💬 Comentar em "{{ post.title }}"</h2>

<p>Comentando como <strong>{{ user.username }}</strong>.</p>

<form method="post" action="{% url 'blog:comment_create' post.pk %}" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="botao-ver-mais">Publicar comentário 💬</button>
</form>

<p class="acoes">
    <a href="{% url 'blog:detail' post.pk %}" class="botao-ver-mais">⬅ Voltar ao post</a>
</p>
{% endblock %}
