{% extends 'base.html' %}

{% block title %}{{ post.title }} | Stella de Solária{% endblock %}

{% block content %}
<h2>✨ {{ post.title }} ✨</h2>
<p class="data-post">Postado em {{ post.date_posted|date:"d/m/Y \à\s H:i" }}</p>

<div class="conteudo-post">
    {{ post.content|safe }}
</div>

<div class="area-stella">
    ✍️ <strong>Área da Stella:</strong>
    <a href="{% url 'blog:update' post.pk %}" class="botao-ver-mais">Editar</a>
    <a href="{% url 'blog:delete' post.pk %}" class="botao-ver-mais botao-perigo">Remover</a>
</div>

<p class="acoes">
    <a href="{% url 'blog:list' %}" class="botao-ver-mais">⬅ Voltar ao diário</a>
</p>
{% endblock %}
