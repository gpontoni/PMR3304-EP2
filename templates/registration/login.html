{% extends 'base.html' %}

{% block title %}Entrar | Stella de Solária{% endblock %}

{% block content %}
<h2>🔑 Entrar</h2>

<p>Entre com a sua conta de fada para comentar no diário.</p>

{% if form.errors %}
<p class="errorlist">Usuário ou senha incorretos. Tente de novo! ✨</p>
{% endif %}

<form method="post" action="{% url 'login' %}" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="botao-ver-mais">Entrar 💖</button>
</form>
{% endblock %}
